name: ci
permissions: read-all
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The whole suite, on every supported Node. Zero runtime dependencies, so a
    # green run here is a green run for a consumer with nothing else installed.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Build (ESM + CommonJS + types)
        run: npm run build
      - name: Test
        run: npm test
      - name: The package installs and loads from a clean directory
        run: |
          set -eu
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install --no-save "$RUNNER_TEMP"/attenu-guard-*.tgz
          node -e "
            const { Authority, Guard, RowLimit } = require('attenu-guard');
            const { guardTool } = require('attenu-guard/adapters/langgraph');
            const g = Guard.issue('root', new Authority({ scopes: ['crm.*'], ceilings: [new RowLimit(10)], ttl: 60 }));
            const c = g.delegate('reader', new Authority({ scopes: ['crm.read'], ttl: 30 }), 'read');
            if (!c.check('crm.read').allowed) throw new Error('allow expected');
            if (c.check('crm.write').allowed) throw new Error('deny expected');
            if (typeof guardTool !== 'function') throw new Error('adapter missing');
            console.log('commonjs entry point ok');
          "
          node --input-type=module -e "
            import { VERSION } from 'attenu-guard';
            import { guardNode } from 'attenu-guard/adapters/langgraph';
            if (typeof guardNode !== 'function') throw new Error('adapter missing');
            console.log('esm entry point ok', VERSION);
          "

  interop:
    # The claim the fixtures exist to support: a bundle written by either
    # implementation verifies with the other. Fails the build if it stops holding.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Install the Python implementation
        # >=0.9 ships this 20-vector delegation-chain interop set as package data
        # (attenu_guard.vectors); tools/gen_fixtures.py copies them verbatim
        # rather than regenerating them, so an older release cannot satisfy it.
        run: python -m pip install --quiet "attenu-guard>=0.9,<0.10" cryptography
      - name: Cross-language suite (TypeScript reads Python, Python reads TypeScript)
        run: npm test
        env:
          ATTENU_GUARD_PY: attenu-guard
      - name: The committed fixtures still match what Python generates
        run: |
          set -eu
          python3 tools/gen_fixtures.py
          git diff --exit-code -- test/fixtures || {
            echo "::error::test/fixtures drifted from the Python implementation — regenerate and review"
            exit 1
          }

  interop-next:
    # Release-gate finding 9: the same cross-language suite, one Python minor ahead of the
    # `interop` job's pin above. This is an early-warning lane, not a release gate on its own —
    # 0.10.0 isn't on PyPI yet, so the install step below checks first and the whole job reports
    # success (not a skip, not a failure) until it is. Once the operator ships 0.10.0, this job
    # starts actually running the suite against it with no workflow edit required; if that run
    # then fails, it means the NEXT Python release broke wire compatibility before this repo's
    # own `interop` job (still pinned to 0.9.x) would ever have caught it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Probe -- a PyPI query failure must fail this job, never read as "not published"
        # Release-gate correction (MEDIUM): runs the exact fail-open reproduction from
        # tools/check-next-python-published.sh's own doc comment on every CI run, so the defect
        # it fixed cannot silently come back. A stub `python3` on PATH simulates a query that
        # fails outright (network error, PyPI outage, ...); the script must exit non-zero, not
        # print "false".
        run: |
          set -eu
          fake_bin="$RUNNER_TEMP/fake-python-bin"
          mkdir -p "$fake_bin"
          cat > "$fake_bin/python3" <<'SCRIPT'
          #!/usr/bin/env bash
          echo "simulated network failure" >&2
          exit 42
          SCRIPT
          chmod +x "$fake_bin/python3"
          if PATH="$fake_bin:$PATH" bash tools/check-next-python-published.sh attenu-guard "0.10."; then
            echo "::error::a failing pip query must fail check-next-python-published.sh, not report \"false\""
            exit 1
          fi
          echo "probe passed: a failing query correctly failed the script"
      - name: Check whether attenu-guard 0.10.x is on PyPI yet
        id: check_next
        run: echo "published=$(bash tools/check-next-python-published.sh attenu-guard "0.10.")" >> "$GITHUB_OUTPUT"
      - name: Install the Python implementation (0.10.x)
        if: steps.check_next.outputs.published == 'true'
        run: python3 -m pip install --quiet "attenu-guard>=0.10,<0.11" cryptography
      - name: Cross-language suite against the next Python minor (early warning, not a fixture check)
        if: steps.check_next.outputs.published == 'true'
        run: npm test
        env:
          ATTENU_GUARD_PY: attenu-guard
